name: Contracts and dataset integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.lock.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: python
      - run: python -m ai_treader_llm.cli evaluate examples/samples.jsonl examples/predictions.jsonl
        env:
          PYTHONPATH: python
