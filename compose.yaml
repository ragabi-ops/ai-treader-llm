name: ai-treader-llm
services:
  jobs:
    profiles: [jobs]
    build:
      context: .
      dockerfile: docker/jobs.Dockerfile
    command: [validate-dataset, examples/samples.jsonl]
    read_only: true
    tmpfs: [/tmp]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
